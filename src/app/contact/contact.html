<section class="section container contact">
  <div>
    <span class="eyebrow">{{ text.eyebrow }}</span>
    <h2 class="section-title">{{ text.title }}</h2>
    <p class="contact__text">{{ text.text }}</p>
  </div>

  <ul class="contact__list">
    <li>
      <a class="contact__item" [href]="phoneHref">
        <svg class="contact__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"
          />
        </svg>
        <span>
          <span class="contact__label">{{ text.phoneLabel }}</span>
          <span class="contact__value">{{ phone }}</span>
        </span>
      </a>
    </li>
    <li>
      <a class="contact__item" [href]="'mailto:' + email">
        <svg class="contact__icon" viewBox="0 0 24 24" aria-hidden="true">
          <rect x="2" y="4" width="20" height="16" rx="2" />
          <path d="m22 7-10 6L2 7" />
        </svg>
        <span>
          <span class="contact__label">{{ text.emailLabel }}</span>
          <!-- On very narrow screens, wrap only after the "@". -->
          <span class="contact__value">{{ emailParts[0] }}@<wbr />{{ emailParts[1] }}</span>
        </span>
      </a>
    </li>
    <li>
      <div class="contact__item">
        <svg class="contact__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
        <span>
          <span class="contact__label">{{ text.areaLabel }}</span>
          <span class="contact__value">{{ text.area }}</span>
        </span>
      </div>
    </li>
  </ul>
</section>
